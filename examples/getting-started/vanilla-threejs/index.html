<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3Lens — Vanilla Three.js Example</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a0f; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #info {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.6);
        font-size: 13px;
        letter-spacing: 0.04em;
        pointer-events: none;
        text-align: center;
      }
      #info strong { color: rgba(255,255,255,0.9); }
      #info kbd {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="info">
      <strong>3Lens</strong> — Vanilla Three.js &nbsp;|&nbsp;
      Press <kbd>F2</kbd> to toggle devtools &nbsp;|&nbsp;
      Orbit: drag &nbsp; Zoom: scroll
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
